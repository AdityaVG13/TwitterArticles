<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X Article Downloader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>X Article Downloader</h1>
        <div class="mode-toggle" role="group" aria-label="Capture mode">
          <button type="button" id="modeSingle" class="mode" data-mode="single">
            Single
          </button>
          <button type="button" id="modeBatch" class="mode" data-mode="batch">
            Batch
          </button>
        </div>
      </header>

      <section id="singleView" hidden>
        <p class="hint">Capture the current X Article tab.</p>
        <button type="button" id="captureSingleBtn" class="primary full">
          Capture this tab
        </button>
      </section>

      <section id="batchView" hidden>
        <div class="row">
          <button type="button" id="addTabBtn" class="ghost">
            Add this tab
          </button>
          <span id="queueCount" class="count">0 in queue</span>
        </div>

        <ul id="queueList" class="queue" aria-live="polite"></ul>

        <div>
          <p class="section-label">Format</p>
          <div class="chips" role="group" aria-label="Export formats">
            <label class="chip" data-format="md">
              <input type="checkbox" name="formats" value="md" />
              <span>Markdown</span>
            </label>
            <label class="chip" data-format="pdf">
              <input type="checkbox" name="formats" value="pdf" />
              <span>PDF</span>
            </label>
            <label class="chip" data-format="docx">
              <input type="checkbox" name="formats" value="docx" />
              <span>DOCX</span>
            </label>
          </div>
        </div>

        <div class="actions">
          <button type="button" id="saveZipBtn" class="primary">
            Save to ZIP
          </button>
          <button type="button" id="clearBtn" class="ghost">Clear</button>
        </div>
      </section>

      <hr class="divider" />
      <p id="status" aria-live="polite"></p>
      <footer>
        <span>Local-first. Files stay on your machine.</span>
        <a href="#" id="openOptions">Options</a>
      </footer>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
