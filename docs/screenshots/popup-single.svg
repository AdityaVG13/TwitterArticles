<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 408 412" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f1c17" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="408" height="412" fill="#d8ded7"/>
  <rect x="24" y="24" width="360" height="364" rx="10" fill="#f4f6f3" filter="url(#shadow)"/>

  <!-- Title -->
  <text x="40" y="56" font-size="14" font-weight="700" fill="#1a221d">X Article Downloader</text>

  <!-- Mode toggle -->
  <rect x="40" y="68" width="328" height="34" rx="8" fill="#eef1ec" stroke="#d8ded7"/>
  <rect x="43" y="71" width="161" height="28" rx="6" fill="#ffffff"/>
  <text x="123.5" y="89" text-anchor="middle" font-size="12" font-weight="600" fill="#044e5c">Single</text>
  <text x="285.5" y="89" text-anchor="middle" font-size="12" font-weight="600" fill="#62706a">Batch</text>

  <!-- Hint -->
  <text x="40" y="138" font-size="12" fill="#62706a">Capture the current X Article tab.</text>

  <!-- Format label -->
  <text x="40" y="172" font-size="11" font-weight="700" fill="#62706a" letter-spacing="0.5">FORMAT</text>

  <!-- Chips -->
  <g>
    <rect x="40" y="184" width="86" height="28" rx="14" fill="#ffffff" stroke="#c4ccc2"/>
    <text x="83" y="202" text-anchor="middle" font-size="12" font-weight="600" fill="#1a221d">Markdown</text>

    <rect x="132" y="184" width="54" height="28" rx="14" fill="#d6e5e8" stroke="#056778"/>
    <text x="159" y="202" text-anchor="middle" font-size="12" font-weight="600" fill="#044e5c">PDF</text>

    <rect x="192" y="184" width="62" height="28" rx="14" fill="#ffffff" stroke="#c4ccc2"/>
    <text x="223" y="202" text-anchor="middle" font-size="12" font-weight="600" fill="#1a221d">DOCX</text>
  </g>

  <!-- Primary button -->
  <rect x="40" y="232" width="328" height="36" rx="8" fill="#056778" stroke="#056778"/>
  <text x="204" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Capture this tab</text>

  <!-- Divider -->
  <line x1="40" y1="296" x2="368" y2="296" stroke="#d8ded7"/>

  <!-- Status -->
  <text x="40" y="320" font-size="12" fill="#044e5c">Saved 1 file.</text>

  <!-- Footer -->
  <text x="40" y="360" font-size="12" fill="#62706a">Local-first. Files stay on your machine.</text>
  <text x="368" y="360" text-anchor="end" font-size="12" font-weight="600" fill="#056778">Options</text>
</svg>
